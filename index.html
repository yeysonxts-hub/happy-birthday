<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revista Edición Especial - Sonaly</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Música de fondo -->
  <audio id="audio-fondo" loop>
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <!-- === PORTADA DE LA REVISTA === -->
  <div id="pantalla-portada" class="contenedor-portada">
    <div class="revista-portada" style="background-image: url('foto1.jpeg');">
      <div class="overlay-portada"></div>
      
      <div class="portada-header">
        <p class="portada-happy">HAPPY</p>
        <h1 class="portada-titulo">BIRTHDAY</h1>
        <p class="portada-magazine">MAGAZINE</p>
      </div>
      
      <div class="portada-footer">
        <div class="codigo-barras"></div>
        <div class="portada-info">
          <h2 class="portada-nombre">SONALY</h2>
          <p class="portada-edicion">BIRTHDAY EDITION</p>
        </div>
      </div>
    </div>
    <!-- Mensaje guía en lugar de botón -->
    <p class="instruccion-clic">Toca la mitad derecha de la pantalla para abrir ▶</p>
  </div>

  <!-- === INTERIOR DE LA REVISTA === -->
  <div id="pantalla-visor" class="oculto">
    <div class="libro-abierto" id="libro-abierto">
      
      <!-- Página Izquierda (Fotos) -->
      <div class="pagina-media">
        <img id="foto-actual" src="" alt="Recuerdo">
      </div>

      <!-- Página Derecha (Textos) -->
      <div class="pagina-texto">
        <h2 class="titulo-articulo">¿Quién eres tú para mí?</h2>
        <div class="separador-rosa"></div>
        
        <!-- Contenedor del texto (aislado para permitir hacer scroll sin cambiar de página) -->
        <div class="contenedor-texto">
          <p id="texto-actual" class="texto-editorial"></p>
        </div>
        
        <!-- Mensaje guía interno -->
        <p class="instruccion-interior" id="guia-interior">◀ Lado izquierdo para volver | Lado derecho para avanzar ▶</p>
      </div>

    </div>
  </div>

  <script>
    // Lista de las 11 fotos y sus textos
    const paginas = [
      { archivo: 'foto1.jpeg', texto: 'Comentario para la foto 1...' },
      { archivo: 'foto2.jpeg', texto: 'Comentario para la foto 2...' },
      { archivo: 'foto3.jpeg', texto: 'Comentario para la foto 3...' },
      { archivo: 'foto4.jpeg', texto: 'Comentario para la foto 4...' },
      { archivo: 'foto5.jpeg', texto: 'Comentario para la foto 5...' },
      { archivo: 'foto6.jpeg', texto: 'Comentario para la foto 6...' },
      { archivo: 'foto7.jpeg', texto: 'Comentario para la foto 7...' },
      { archivo: 'foto8.jpeg', texto: 'Comentario para la foto 8...' },
      { archivo: 'foto9.jpeg', texto: 'Comentario para la foto 9...' },
      { archivo: 'foto10.jpeg', texto: 'Comentario para la foto 10...' },
      { 
        archivo: 'foto11.jpeg', 
        texto: '¡Feliz cumpleaños! Eres una chica unica y muy especial para mi. Te amo demasiado. Fuiste quien le dio brillo a mi vida, antes de conocerte vivia la vida en automatico sin ningun proposito y cuando te conoci simplemente todo fluyo, entraste en mi vida sin pedir permiso y me hiciste ver la vida de otra manera. De que no todo estaba perdido para mi y cada que tenia algun problema o me sentia decaido nunca te lo decia,porque no queria preocuparte , pero te juro que cuando te veia todo desaparecia y queria hacerte la chica mas feliz del mundo. Se que no fui perfecto, pero estoy mejorando. Estoy loco por ti , tanto que aguantaria lo que sea por ti. Se que me dejaste las cosas en claro,pero siento que todavia no pierdes las esperanzas en mi y sabes que puedo mejorar y ya no volver a lo mismo y no te vas a arrepentir si decides confiar en mi una ultima vez.' 
      }
    ];

    let indiceActual = 0;

    const pantallaPortada = document.getElementById('pantalla-portada');
    const pantallaVisor = document.getElementById('pantalla-visor');
    const libroAbierto = document.getElementById('libro-abierto');
    const audioFondo = document.getElementById('audio-fondo');
    
    const fotoActual = document.getElementById('foto-actual');
    const textoActual = document.getElementById('texto-actual');
    const guiaInterior = document.getElementById('guia-interior');

    // === LÓGICA DE CLICS EN PANTALLA ===
    document.addEventListener('click', (e) => {
      // Evitar que cambie de página si el usuario está intentando arrastrar/hacer scroll en el texto largo
      if (e.target.closest('.contenedor-texto')) return;

      const mitadPantalla = window.innerWidth / 2;
      const clicDerecha = e.clientX > mitadPantalla;

      // Fase 1: Si estamos en la portada
      if (pantallaPortada.style.display !== 'none') {
        if (clicDerecha) {
          pantallaPortada.style.display = 'none';
          pantallaVisor.style.display = 'flex';
          audioFondo.play();
          actualizarPagina();
        }
      } 
      // Fase 2: Si estamos dentro de la revista
      else {
        if (clicDerecha) {
          if (indiceActual < paginas.length - 1) {
            indiceActual++;
            aplicarAnimacion();
          }
        } else {
          if (indiceActual > 0) {
            indiceActual--;
            aplicarAnimacion();
          }
        }
      }
    });

    // === CAMBIO VISUAL DEL MOUSE ===
    document.addEventListener('mousemove', (e) => {
      const mitad = window.innerWidth / 2;
      
      // Portada: Solo cursor en la derecha
      if (pantallaPortada.style.display !== 'none') {
        document.body.style.cursor = (e.clientX > mitad) ? 'pointer' : 'default';
      } 
      // Interior: Cursor a los lados dependiendo si hay página
      else {
        if (e.clientX > mitad && indiceActual < paginas.length - 1) {
          document.body.style.cursor = 'pointer'; // Hay página siguiente
        } else if (e.clientX <= mitad && indiceActual > 0) {
          document.body.style.cursor = 'pointer'; // Hay página anterior
        } else {
          document.body.style.cursor = 'default'; // Límite de revista
        }
      }
    });

    // === ANIMACIÓN DE REVISTA ===
    function aplicarAnimacion() {
      libroAbierto.classList.remove('animacion-pasar');
      void libroAbierto.offsetWidth; // Reiniciar flujo
      libroAbierto.classList.add('animacion-pasar');
      setTimeout(actualizarPagina, 150); // Cambiar la info a mitad de la hoja
    }

    function actualizarPagina() {
      const item = paginas[indiceActual];
      fotoActual.src = item.archivo;
      textoActual.textContent = item.texto;

      // Actualizar mensaje de guía
      if (indiceActual === 0) {
        guiaInterior.textContent = 'Toca el lado derecho para avanzar ▶';
      } else if (indiceActual === paginas.length - 1) {
        guiaInterior.textContent = '◀ Toca el lado izquierdo para volver';
      } else {
        guiaInterior.textContent = '◀ Izquierda para volver | Derecha para avanzar ▶';
      }
    }
  </script>
</body>
</html>
